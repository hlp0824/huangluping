  <script type="text/javascript" charset="utf-8">
    $(function () {
      var $AgencyId = GetQueryString("agencyId");
      var $branchName = GetQueryString("branchName");
      var $data = {
        agencyid: $AgencyId,
        brancH_NAME: $branchName,
      };
      //$(".notice-url").attr("href", "AgencyNotice/index.html");

      GetAgencyInfo($data,function(data){
        $(".agency-url").attr(
          "href",
          "http://fdc.zfj.xm.gov.cn:8081/xygl/AgencyManage/AgencyDetail?agencyId=" +
          data.agencyInfo.agencyid
        );
        
      });

      
    });

    // 获取机构信息
    function GetAgencyInfo(data,fnCallback) {
      if (nulltokong(GetQueryString("agencyId")) == "") {
        ErrorTips();
        return;
      }
      // var data = {
      //   AGENCYID: agencyid,
      //   brancH_NAME: branchName,
      // };
      $.ajax({
        type: "POST",
        data: JSON.stringify(data),
        // url: "http://222.222.222.15:8088/api/Credit/GetAgencyInfo",
        //url: "http://222.76.242.144:8001/api/Credit/GetAgencyInfo",
        url: "https://fdc.szjj.xm.gov.cn:8001/api/Credit/GetAgencyInfo",
        dataType: "json",
        contentType: "application/json",
        success: function (data) {
          if (data.body) {
            console.log(data);
            var branchData = data.body.branchInfo;
            var agencyData = data.body.agencyInfo;

            $(".branchName").text(branchData.agencY_NAME);
            $(".branchAddress").text(branchData.businesS_ADDRESS);
            var startText = SetLevel(agencyData.xyfs);
            $("#creditLevel").text(startText);
            $("#creditStatus").text(agencyData.xyzt == 1 ? "诚信" : "预警");
            var stars = Md.GetMdStars(branchData.brancH_CREDITRATING);
            $("#Stars").html(stars);
            fnCallback && fnCallback(data.body);
          } else {
            ErrorTips();
            return;
          }
          
        },
        error: function (error) {
          layer.open({
            content: "您查询的数据不存在，请联系管理员",
            skin: "msg",
            time: 2, //2秒后自动关闭
          });
          return;
        },
      });
    }
    // 门店类
    var Md = {
      // 获取星星数
      GetMdStars: function (score) {
        if (score == 0 || !score) {
          return "无";
        } else {
          return "⭐".repeat(score);
        }
      },
      // 搜索
      searchAll:function() {
        var keyword = $("input[name='keyword']").val();
        if (keyword == "" || keyword == undefined || !keyword) {
          ErrorTips("关键字不能为空");
          return;
        }
        var url =
          "http://fdc.zfj.xm.gov.cn:8081/xygl/Search/SearchAll?agency_name=" +
          keyword;
        $("input[name='keyword']").val("");
        window.open(url);
      },
    };

    // 设置等级
    function SetLevel(score) {
      if (score == "" || score == null) {
        return "暂无评定";
      }
      if (95 < score && score <= 100) {
        return "AAAAA";
      } else if (90 < score && score <= 95) {
        return "AAAA";
      } else if (80 < score && score <= 90) {
        return "AAA";
      } else if (70 < score && score <= 80) {
        return "AA";
      } else if (60 < score && score <= 70) {
        return "A";
      } else if (50 < score && score <= 60) {
        return "B";
      } else if (0 <= score && score <= 50) {
        return "C";
      }
    }
    // url获取id
    function GetQueryString(name) {
      var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); // 匹配目标参数
      var result = window.location.search.substr(1).match(reg); // 对querystring匹配目标参数
      if (result != null) {
        return decodeURIComponent(result[2]);
      } else {
        return null;
      }
    }
    // 空判断
    function nulltokong(str) {
      if (str == null) return " ";
      else return str;
    }
    // 错误提示
    function ErrorTips(tips) {
      layer.open({
        content: tips || "您查询的数据不存在，请联系管理员",
        skin: "msg",
        time: 2, //2秒后自动关闭
      });
    }
  </script>
  <script>
    (function (doc, win) {
      var docEl = doc.documentElement,
        resizeEvt =
          "orientationchange" in window ? "orientationchange" : "resize",
        recalc = function () {
          var clientWidth = docEl.clientWidth;
          if (!clientWidth) return;
          docEl.style.fontSize = clientWidth / 7.5 + "px";
        };
      if (!doc.addEventListener) return;
      win.addEventListener(resizeEvt, recalc, false);
      doc.addEventListener("DOMContentLoaded", recalc, false);
    })(document, window);
  </script>
